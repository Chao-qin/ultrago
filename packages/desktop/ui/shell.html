<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"><title>UltraGo · 快捷菜单</title><link rel="stylesheet" href="shell.css"></head><body><button id="shell-trigger" aria-label="客户端菜单，可拖动" aria-expanded="false" aria-controls="shell-menu" title="点击打开菜单，拖动后吸附到最近边缘"><img src="app-icon.png" alt=""></button><div id="shell-menu" hidden><div class="menu-heading"><strong>UltraGo</strong><small>客户端快捷操作</small></div><button data-shell-action="setup">准备与连接 <span>↗</span></button><button data-shell-action="workbench" disabled>进入工作台 <span>→</span></button><div class="zoom-row"><span>页面缩放</span><button data-shell-action="zoomOut" aria-label="缩小">−</button><button data-shell-action="zoomReset">100%</button><button data-shell-action="zoomIn" aria-label="放大">＋</button></div><button data-shell-action="tray">收起到托盘 <span>↙</span></button><button data-shell-action="quit" class="quit">退出应用 <small>停止本地服务</small></button><p id="shell-error" role="alert" hidden></p></div><script type="module" src="shell.mjs"></script></body></html>
